  </defs>
  <style>
    .clouds { animation: drift 36s ease-in-out infinite alternate; }
    .shimmer { animation: shimmer 7s ease-in-out infinite alternate; }
    .shimmer-secondary { animation: shimmer 9s ease-in-out -4s infinite alternate-reverse; }
    .boat { transform-box: fill-box; transform-origin: center; animation: bob 6s ease-in-out infinite; }
    @keyframes drift { to { transform: translateX(12px); } }
    @keyframes shimmer { from { opacity: .35; transform: translateX(-3px); } to { opacity: .7; transform: translateX(3px); } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(1.5px) rotate(.5deg); } }
    @media (prefers-reduced-motion: reduce) { .clouds, .shimmer, .shimmer-secondary, .boat { animation: none; } }
  </style>
