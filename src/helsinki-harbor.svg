<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101f38"/><stop offset=".6" stop-color="#4c7287"/><stop offset="1" stop-color="#b6b9aa"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#527482"/><stop offset=".45" stop-color="#254658"/><stop offset="1" stop-color="#101f34"/></linearGradient>
    <linearGradient id="stone" x2="1" y2=".25"><stop stop-color="#819798"/><stop offset=".3" stop-color="#c7cec4"/><stop offset=".7" stop-color="#eee6cf"/><stop offset="1" stop-color="#a6b5b1"/></linearGradient>
    <linearGradient id="dome"><stop stop-color="#244e55"/><stop offset=".4" stop-color="#668c87"/><stop offset=".65" stop-color="#47746f"/><stop offset="1" stop-color="#1e454c"/></linearGradient>
    <linearGradient id="reflection" x2="0" y2="1"><stop stop-color="#e6dcb3" stop-opacity=".5"/><stop offset="1" stop-color="#c9dccf" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#d5e4dd" stop-opacity=".24"/><stop offset="1" stop-color="#d5e4dd" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon"><stop stop-color="#fff8dd"/><stop offset=".8" stop-color="#e0e7d6"/><stop offset="1" stop-color="#b2c8c4"/></radialGradient>
    <clipPath id="harbor-waterline"><path d="M0 216h640v64H0z"/></clipPath>
    <filter id="harbor-ripple-softness">
      <feGaussianBlur stdDeviation=".55"/>
    </filter>
    <pattern id="harbor-far-ripples" y="216" width="223" height="64" patternUnits="userSpaceOnUse">
      <path fill="#b9d4d6" opacity=".26" filter="url(#harbor-ripple-softness)"
        d="M8 12q17-3 37 0-20-1-37 0z
           M67 6q10-2 24 0-13-.7-24 0z
           M110 18q22-4 50 0-28-1.5-50 0z
