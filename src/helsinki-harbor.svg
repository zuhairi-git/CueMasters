           M29 26q25-4.5 53 0-29-1.7-53 0z
           M164 31q22-3.8 49 0-26-1.2-49 0z"/>
    </pattern>
    <pattern id="harbor-near-ripples" y="216" width="317" height="64" patternUnits="userSpaceOnUse">
      <path fill="#b9d4d6" opacity=".3" filter="url(#harbor-ripple-softness)"
        d="M12 40q22-4.2 48 0-26-1.4-48 0z
           M39 59q36-6 77 0-41-2-77 0z
           M92 34q18-3.3 40 0-22-1.2-40 0z
           M130 49q32-5.6 67 0-36-1.8-67 0z
           M212 37q15-3.6 35 0-19-1.3-35 0z
           M234 57q31-5.8 68 0-36-2.1-68 0z"/>
    </pattern>
    <g id="column"><path fill="#677e80" d="M-1 0h8v32h-8z"/><path fill="url(#stone)" d="M0 0h5v32H0z"/><path stroke="#f0e8d3" stroke-width=".6" d="M1 2v28M3 2v28"/><path fill="#d7d8c8" d="M-2 0h9v3h-9zm0 30h9v3h-9z"/></g>
  </defs>
  <style>
    .harbor-clouds { animation: harbor-drift 36s ease-in-out infinite alternate; }
    .harbor-waves { animation: harbor-wave-travel var(--ripple-duration) linear infinite; }
    .harbor-waves-far { --ripple-distance: -223px; --ripple-duration: 61s; }
    .harbor-waves-near { --ripple-distance: -317px; --ripple-duration: 43s; }
    .harbor-boat { transform-box: fill-box; transform-origin: center; animation: harbor-bob 6s ease-in-out infinite; }
    @keyframes harbor-drift { to { transform: translateX(5px); } }
    @keyframes harbor-wave-travel { to { transform: translateX(var(--ripple-distance)); } }
    @keyframes harbor-bob { 0%, 100% { transform: translateY(0) rotate(-.2deg); } 50% { transform: translateY(.8px) rotate(.2deg); } }
    @media (prefers-reduced-motion: reduce) { .harbor-clouds, .harbor-waves, .harbor-boat { animation: none; } }
  </style>
  <path fill="url(#sky)" d="M0 0h640v215H0z"/>
  <circle cx="471" cy="66" r="90" fill="url(#halo)"/>
  <circle cx="471" cy="66" r="21" fill="url(#moon)"/>
  <g fill="#9daea6" opacity=".14"><ellipse cx="465" cy="60" rx="6" ry="8"/><ellipse cx="478" cy="72" rx="8" ry="5"/><circle cx="464" cy="76" r="3"/></g>
  <g fill="#eef0dd" opacity=".5"><circle cx="87" cy="30" r=".65"/><circle cx="223" cy="43" r=".6"/><circle cx="369" cy="22" r=".7"/><circle cx="562" cy="37" r=".55"/><circle cx="144" cy="61" r=".45"/></g>
